server:
  port: 8081
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:h2:file:./data/leavedb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8080}
    auth:
      method: basic
      username: ${CAMUNDA_USERNAME:}
      password: ${CAMUNDA_PASSWORD:}
